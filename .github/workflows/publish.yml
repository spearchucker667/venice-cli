name: Publish to npm

on:
  release:
    types: [published]

# Trusted publishing (OIDC): id-token: write lets GitHub mint a short-lived
# OIDC token that the npm CLI exchanges for a publish token. No long-lived
# NPM_TOKEN is required. The npmjs.com "trusted publisher" for this package
# must be configured with:
#   Provider: GitHub Actions
#   Organization or user: spearchucker667
#   Repository: venice-cli
#   Workflow filename: publish.yml
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm trusted publishing requires npm CLI >= 11.5.1 (Node 22 ships an
      # older npm), so upgrade explicitly before publishing.
      - name: Upgrade npm
        run: npm install --global npm@11

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run verify

      - name: Verify package identity
        run: |
          test "$(node -p "require('./package.json').name")" = "@spearchucker667/venice-cli"
          echo "Package: $(node -p "require('./package.json').name")"
          echo "Version: $(node -p "require('./package.json').version")"

      # Release tag and npm version must not silently diverge: a release
      # tagged v2.1.1 must carry package.json version 2.1.1.
      - name: Verify version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
          echo "Release tag ${GITHUB_REF_NAME} matches package version ${PKG_VERSION}"

      # Trusted publishing (OIDC) authenticates the publish; provenance is
      # generated automatically when publishing a public package from a public
      # repository via trusted publishing. publishConfig in package.json
      # forces public access for the scoped package.
      - name: Publish to npm
        run: npm publish --access public
