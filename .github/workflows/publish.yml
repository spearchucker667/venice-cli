name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run verify

      # - name: Publish to npm
      #   run: npm publish --provenance --access public
      #   # Note: Trusted publishing (OIDC) is preferred over NPM_TOKEN. 
      #   # When the npm package ownership for this fork is verified,
      #   # enable trusted publishing in npm to remove the need for NODE_AUTH_TOKEN.
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
